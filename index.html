<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- /vite.svg never existed in public/, so the tab has been showing a
         broken icon in production. The .ico carries 16 and 32 for browsers
         that still ask for it; the PNG is what modern ones pick. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- maximum-scale/user-scalable lock zoom in the Capacitor wrapper and on
         Android. iOS Safari has ignored user-scalable=no since iOS 10 (an
         accessibility decision by Apple), so pinch still works there by
         design. The auto-zoom that actually made the app feel broken came
         from sub-16px inputs, fixed in input/textarea. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1B6B55" />
    <title>Bartefy</title>
    <!-- Applies the saved theme before first paint. Without this a person who
         chose dark gets a parchment flash on every load, because React has not
         mounted yet when the browser paints the first frame. Kept inline and
         tiny on purpose -- an external file would be a second round trip in
         front of the render. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('bartefy.theme') || 'dark'
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.setAttribute('data-theme', 'dark')
            var m = document.querySelector('meta[name="theme-color"]')
            if (m) m.setAttribute('content', '#17191E')
          }
        } catch (e) {
          /* Blocked site data: fall through to light, which is the default. */
        }
      })()
    </script>
    <!-- The boot splash. Painted from the first frame, before the bundle has
         even downloaded, and lifted by App.tsx (hideBoot) once the saved
         sign-in has been checked. Without it a signed-in person opening the
         app saw the sign-in form for a second -- the time it takes to renew
         an expired token -- before being moved to Discover. Colours match
         --background in both themes (data-theme is set by the script above). -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
              background: #F5F4EF; transition: opacity 200ms cubic-bezier(0.2, 0, 0, 1); }
      html[data-theme='dark'] #boot { background: #16181D; }
      #boot svg { width: 72px; height: 72px; border-radius: 22%;
                  animation: boot-breathe 1.2s cubic-bezier(0.2, 0, 0, 1) infinite alternate; }
      #boot.done { opacity: 0; pointer-events: none; }
      @keyframes boot-breathe { to { transform: scale(0.94); } }
      @media (prefers-reduced-motion: reduce) { #boot svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
        <rect width="1400" height="1400" fill="#1B6B55" />
        <path transform="translate(-198 -257)" fill="#FFFFFF" d="M697 445L828 618L757 604L757 735C790 650 880 598 1000 598C1100 598 1165 670 1162 790C1160 860 1120 905 1075 922C1170 945 1235 1010 1232 1095C1228 1230 1110 1340 925 1418L970 1470L783 1425L878 1253L885 1325C1020 1270 1105 1210 1105 1120C1105 1040 1060 1000 990 998C930 996 870 1005 820 1005L818 975C870 955 930 945 960 935C1030 912 1072 865 1072 790C1072 720 1030 688 975 688C880 688 800 740 762 830L757 1405L700 1405C660 1405 635 1380 635 1340L635 602L565 618Z" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
