<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="web_standard" name="shell-type">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"surface-container":"#f6ece7","on-tertiary-container":"#fffbff","on-secondary-container":"#3b6c52","error-container":"#ffdad6","tertiary-fixed-dim":"#ffb95b","primary-fixed-dim":"#ffb59f","surface-variant":"#eae1db","on-primary-fixed-variant":"#852400","on-primary":"#ffffff","tertiary-fixed":"#ffddb6","on-background":"#1f1b18","secondary":"#36684e","on-primary-fixed":"#3a0a00","surface-container-high":"#f0e6e1","background":"#fff8f5","primary":"#a93103","inverse-primary":"#ffb59f","inverse-on-surface":"#f9efe9","surface":"#fff8f5","on-tertiary-fixed":"#2a1800","primary-fixed":"#ffdbd0","on-secondary-fixed":"#002112","primary-container":"#cb491e","on-tertiary":"#ffffff","secondary-fixed-dim":"#9dd2b3","on-primary-container":"#fffbff","inverse-surface":"#342f2c","on-error":"#ffffff","surface-bright":"#fff8f5","error":"#ba1a1a","on-secondary-fixed-variant":"#1d5038","on-error-container":"#93000a","on-tertiary-fixed-variant":"#643f00","secondary-container":"#b6eccb","outline-variant":"#e1bfb6","surface-container-low":"#fcf2ec","surface-tint":"#ac3406","surface-dim":"#e1d8d3","tertiary-container":"#a26800","surface-container-lowest":"#ffffff","on-surface-variant":"#59413a","secondary-fixed":"#b9efce","surface-container-highest":"#eae1db","outline":"#8d7169","on-surface":"#1f1b18","on-secondary":"#ffffff","tertiary":"#815200"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"space-lg":"1.5rem","space-sm":"0.5rem","space-md":"1rem","gutter-desktop":"2rem","margin":"1rem","gutter":"1.25rem","margin-desktop":"2.5rem","space-xl":"2.5rem","space-xs":"0.25rem"},"fontFamily":{"ticker-number":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"],"headline-sm":["Epilogue"],"label-md":["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"label-lg":["Plus Jakarta Sans"],"headline-lg-mobile":["Epilogue"],"body-lg":["Plus Jakarta Sans"],"body-sm":["Plus Jakarta Sans"],"headline-xl-mobile":["Epilogue"],"headline-md":["Epilogue"],"headline-xl":["Epilogue"],"headline-lg":["Epilogue"]},"fontSize":{"ticker-number":["14px",{"lineHeight":"18px","fontWeight":"700"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.05em","fontWeight":"700"}],"headline-sm":["18px",{"lineHeight":"26px","fontWeight":"600"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.03em","fontWeight":"600"}],"body-md":["15px",{"lineHeight":"24px","fontWeight":"400"}],"label-lg":["14px",{"lineHeight":"20px","letterSpacing":"0.02em","fontWeight":"700"}],"headline-lg-mobile":["24px",{"lineHeight":"32px","fontWeight":"700"}],"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}],"body-sm":["13px",{"lineHeight":"20px","fontWeight":"400"}],"headline-xl-mobile":["30px",{"lineHeight":"38px","fontWeight":"800"}],"headline-md":["22px",{"lineHeight":"30px","fontWeight":"600"}],"headline-xl":["40px",{"lineHeight":"48px","fontWeight":"800"}],"headline-lg":["32px",{"lineHeight":"40px","fontWeight":"700"}]}}}};</script></head>
<body class="bg-background font-body-md text-on-surface antialiased">
<div id="frame" style="width:736px;padding:16px;box-sizing:content-box"><div class="w-full bg-surface-container-lowest rounded-xl px-space-lg py-4 shadow-md" data-organism="deck_actions" data-variant="wide">
<div role="group" aria-label="Decide on this find" class="flex items-start justify-center gap-6">

<button type="button" class="group flex flex-col items-center gap-1.5 w-20 outline-none " data-action="undo" aria-label="Undo your last pass — a Collector perk" title="Undo your last pass — a Collector perk">
  <span class="relative grid place-items-center rounded-full transition-[transform,box-shadow] duration-200 ease-[cubic-bezier(0.2,0,0,1)] group-hover:-translate-y-0.5 group-active:translate-y-0 group-active:scale-95 group-focus-visible:ring-[3px] group-focus-visible:ring-primary/40 bg-surface-container-lowest ring-1 ring-outline-variant/50 shadow-[0_2px_8px_rgba(31,27,24,0.08)] group-hover:shadow-[0_8px_18px_rgba(31,27,24,0.14)] w-16 h-16"><span class="material-symbols-outlined text-[28px] text-outline">undo</span><span class="absolute -top-1 -right-1.5 flex items-center gap-0.5 h-5 px-1.5 rounded-full ring-2 ring-surface-container-lowest font-label-sm text-[10px] leading-none bg-tertiary-fixed text-on-tertiary-fixed"><span class="material-symbols-outlined text-[12px]">lock</span></span></span>
  <span class="font-label-md text-label-md whitespace-nowrap text-on-surface-variant">Undo</span>
</button>

<button type="button" class="group flex flex-col items-center gap-1.5 w-20 outline-none " data-action="pass" aria-label="Pass" title="Pass">
  <span class="relative grid place-items-center rounded-full transition-[transform,box-shadow] duration-200 ease-[cubic-bezier(0.2,0,0,1)] group-hover:-translate-y-0.5 group-active:translate-y-0 group-active:scale-95 group-focus-visible:ring-[3px] group-focus-visible:ring-primary/40 bg-surface-container-lowest ring-1 ring-outline-variant/50 shadow-[0_2px_8px_rgba(31,27,24,0.08)] group-hover:shadow-[0_8px_18px_rgba(31,27,24,0.14)] w-16 h-16"><span class="material-symbols-outlined text-[28px] text-on-surface">close</span></span>
  <span class="font-label-md text-label-md whitespace-nowrap text-on-surface-variant">Pass</span>
</button>

<button type="button" class="group flex flex-col items-center gap-1.5 w-20 outline-none " data-action="want" aria-label="Put one of your finds on the table for this one" title="Put one of your finds on the table for this one">
  <span class="relative grid place-items-center rounded-full transition-[transform,box-shadow] duration-200 ease-[cubic-bezier(0.2,0,0,1)] group-hover:-translate-y-0.5 group-active:translate-y-0 group-active:scale-95 group-focus-visible:ring-[3px] group-focus-visible:ring-primary/40 bg-primary text-on-primary shadow-[0_6px_18px_rgba(169,49,3,0.32)] group-hover:shadow-[0_10px_24px_rgba(169,49,3,0.38)] w-16 h-16"><span class="material-symbols-outlined text-[28px] ">handshake</span></span>
  <span class="font-label-md text-label-md whitespace-nowrap text-primary font-bold">Put on Table</span>
</button>

<button type="button" class="group flex flex-col items-center gap-1.5 w-20 outline-none " data-action="super" aria-label="Super offer — lands at the top of their offers (50 pts)" title="Super offer — lands at the top of their offers (50 pts)">
  <span class="relative grid place-items-center rounded-full transition-[transform,box-shadow] duration-200 ease-[cubic-bezier(0.2,0,0,1)] group-hover:-translate-y-0.5 group-active:translate-y-0 group-active:scale-95 group-focus-visible:ring-[3px] group-focus-visible:ring-primary/40 bg-surface-container-lowest ring-1 ring-outline-variant/50 shadow-[0_2px_8px_rgba(31,27,24,0.08)] group-hover:shadow-[0_8px_18px_rgba(31,27,24,0.14)] w-16 h-16"><span class="material-symbols-outlined text-[28px] text-tertiary">bolt</span><span class="absolute -top-1 -right-1.5 flex items-center gap-0.5 h-5 px-1.5 rounded-full ring-2 ring-surface-container-lowest font-label-sm text-[10px] leading-none bg-tertiary-fixed text-on-tertiary-fixed"><span class="material-symbols-outlined text-[12px]">toll</span>50</span></span>
  <span class="font-label-md text-label-md whitespace-nowrap text-on-surface-variant">Super</span>
</button>

<button type="button" class="group flex flex-col items-center gap-1.5 w-20 outline-none " data-action="boost" aria-label="Boost one of your finds for a day (75 pts)" title="Boost one of your finds for a day (75 pts)">
  <span class="relative grid place-items-center rounded-full transition-[transform,box-shadow] duration-200 ease-[cubic-bezier(0.2,0,0,1)] group-hover:-translate-y-0.5 group-active:translate-y-0 group-active:scale-95 group-focus-visible:ring-[3px] group-focus-visible:ring-primary/40 bg-surface-container-lowest ring-1 ring-outline-variant/50 shadow-[0_2px_8px_rgba(31,27,24,0.08)] group-hover:shadow-[0_8px_18px_rgba(31,27,24,0.14)] w-16 h-16"><span class="material-symbols-outlined text-[28px] text-secondary">trending_up</span><span class="absolute -top-1 -right-1.5 flex items-center gap-0.5 h-5 px-1.5 rounded-full ring-2 ring-surface-container-lowest font-label-sm text-[10px] leading-none bg-tertiary-fixed text-on-tertiary-fixed"><span class="material-symbols-outlined text-[12px]">toll</span>75</span></span>
  <span class="font-label-md text-label-md whitespace-nowrap text-on-surface-variant">Boost</span>
</button>
</div>
</div></div>
</body></html>
