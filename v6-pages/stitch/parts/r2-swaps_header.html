<body class="bg-background font-body-md text-on-surface antialiased">
<div id="frame" style="width:1120px;padding:16px;box-sizing:content-box"><div class="relative bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.03)] p-8 md:p-10 mb-10 overflow-hidden">
<div class="absolute -right-16 -top-16 w-80 h-80 rounded-full bg-gradient-to-bl from-primary-fixed/20 via-tertiary-fixed/10 to-transparent pointer-events-none"></div>
<div class="relative z-10 max-w-3xl">
<div class="flex items-center gap-2 mb-3">
<span class="bg-primary-fixed text-on-primary-fixed font-label-sm text-label-sm px-2.5 py-1 rounded-full uppercase tracking-wider font-bold">Trading Floor</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Round-the-clock escrow desk</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tight leading-none mb-3">
          Active Swaps &amp; Negotiations
        </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed mb-8">
          Deadlines on other people's attention, not yours. Real human trades backed by 24-hour server-enforced countdowns to keep items moving off tables.
        </p>
<!-- Dynamic Filter Tabs -->
<div class="flex items-center gap-2 overflow-x-auto pb-2 -mb-2 no-scrollbar" id="filter-tabs">
<button class="tab-btn px-4 py-2 rounded-lg font-label-lg text-label-lg bg-primary text-on-primary shadow-sm transition-all whitespace-nowrap" data-filter="all" type="button">
            All Swaps (3)
          </button>
<button class="tab-btn px-4 py-2 rounded-lg font-label-lg text-label-lg bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all flex items-center gap-1.5 whitespace-nowrap" data-filter="received" type="button">
            Offers Received
            <span class="bg-error-container text-on-error-container font-label-sm text-label-sm px-2 py-0.5 rounded-full font-bold">2 urgent</span>
</button>
<button class="tab-btn px-4 py-2 rounded-lg font-label-lg text-label-lg bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all flex items-center gap-1.5 whitespace-nowrap" data-filter="sent" type="button">
            Offers Sent
            <span class="bg-surface-variant text-on-surface-variant font-label-sm text-label-sm px-2 py-0.5 rounded-full">1 awaiting</span>
</button>
<button class="tab-btn px-4 py-2 rounded-lg font-label-lg text-label-lg bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all flex items-center gap-1.5 whitespace-nowrap" data-filter="agreed" type="button">
            Agreed &amp; Ready to Meet
            <span class="bg-secondary-container text-on-secondary-container font-label-sm text-label-sm px-2 py-0.5 rounded-full font-bold">1</span>
</button>
<button class="tab-btn px-4 py-2 rounded-lg font-label-lg text-label-lg bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all whitespace-nowrap" data-filter="history" type="button">
            History (Archived)
